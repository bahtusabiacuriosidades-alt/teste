<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;src:url(montserrat-latin.woff2) format('woff2');font-weight:100 900;}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#ov{position:absolute;left:0;top:0;width:1080px;height:1920px;font-family:Mont,sans-serif;pointer-events:none}
.hud{position:absolute;left:48px;top:150px}
.hud .a{display:inline-block;background:rgba(20,16,12,.75);border-radius:14px;padding:10px 22px;font-weight:900;font-size:34px;color:#fff}
.hud .b{margin-top:12px;display:inline-block;background:rgba(255,255,255,.95);border-radius:30px;padding:8px 20px;font-weight:900;font-size:26px;color:#2A2420}
#cap{position:absolute;left:0;right:0;top:1470px;text-align:center}
#cap span{display:inline-block;font-weight:900;font-size:104px;color:#fff;-webkit-text-stroke:19px rgba(0,0,0,.92);paint-order:stroke fill;text-shadow:0 8px 18px rgba(0,0,0,.45)}
#tit{position:absolute;left:0;right:0;top:300px;text-align:center;font-weight:900;font-size:128px;line-height:1.05;color:#D9A021;-webkit-text-stroke:25px #2A1A0A;paint-order:stroke fill;transform:rotate(-4deg)}
#tag{position:absolute;top:0;font-weight:900;font-size:30px;color:#fff;background:rgba(20,16,12,.8);padding:6px 16px;border-radius:20px;border:3px solid #D9A021}
</style></head><body>
<div id="ov"><div class="hud"><div class="a"><span style="color:#D9A021">BAH, TU SABIA?</span> · AMOSTRA 3D</div><br><div class="b">🎭 EXPRESSÕES E GESTOS</div></div><div id="tit"></div><div id="cap"></div></div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const W=1080,H=1920, FPS=30;
const TL=await (await fetch('tl_expr.json')).json();
const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(W,H); r.setPixelRatio(1);
r.outputColorSpace=THREE.SRGBColorSpace; r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
r.domElement.style.position='absolute'; document.body.insertBefore(r.domElement, document.body.firstChild);
const scene=new THREE.Scene();
const bg=await new THREE.TextureLoader().loadAsync('fundo.png'); bg.colorSpace=THREE.SRGBColorSpace; scene.background=bg;
scene.add(new THREE.HemisphereLight(0xfff1dc,0x6b5a3a,1.35));
const sun=new THREE.DirectionalLight(0xffe0b0,2.1); sun.position.set(1.8,2.6,2.2); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-1.5,right:1.5,top:1.5,bottom:-1.5,near:0.5,far:8}); sun.shadow.bias=-0.0005; scene.add(sun);
const fill=new THREE.DirectionalLight(0xc8d8ff,0.45); fill.position.set(-2,1.5,2); scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(8,8),new THREE.ShadowMaterial({opacity:0.32})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const cam=new THREE.PerspectiveCamera(35,W/H,0.05,50);
const load=(f)=>new Promise(res=>new GLTFLoader().load(f,res));
const SPEC={
  lauro:{file:'lauro_anim.glb',pos:[0,0,0],s:1.0,yaw:0.0, head:0.9},
  guria:{file:'guria_anim.glb',pos:[-0.5,0,0.22],s:0.76,yaw:0.38, head:0.66},
  pia:{file:'pia_anim.glb',pos:[0.5,0,0.22],s:0.76,yaw:-0.38, head:0.66},
  cusco:{file:'cusco_anim.glb',pos:[0.28,0,0.7],s:0.33,yaw:-0.6, path:[12.0,14.6,1.7], cyc:0.26},
};
const C={};
for(const [k,sp] of Object.entries(SPEC)){
  const g=await load(sp.file); const root=new THREE.Group(); root.add(g.scene); root.scale.setScalar(sp.s); scene.add(root);
  const ms=[]; g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false; if(o.morphTargetDictionary)ms.push(o);}});
  const mixer=new THREE.AnimationMixer(g.scene); const acts={};
  for(const a of g.animations){const ac=mixer.clipAction(a); ac.play(); ac.setEffectiveWeight(0); acts[a.name]=ac;}
  root.position.set(...sp.pos); C[k]={root,ms,mixer,acts,sp,yaw:sp.yaw};
}
const speakerAt=(t)=>{for(const f of TL.falas) if(t>=f.s-0.05&&t<f.e+0.05) return f.quem; return null;};
const lastSpeaker=(t)=>{let q='lauro'; for(const f of TL.falas) if(t>=f.s-0.3) q=f.quem; return q;};
const sm=(x)=>{x=Math.min(1,Math.max(0,x)); return x*x*(3-2*x);};
const win=(t,s,e,f=0.25)=>sm((t-s+0.05)/f)*(1-sm((t-e+0.05)/f));
const talkW=(k,t)=>{let w=0; for(const f of TL.falas) if(f.quem===k) w=Math.max(w,win(t,f.s,f.e,0.2)); return w;};
// Cusco: chega trotando e depois late
const cuscoX=(t)=>{const [t0,t1,x0]=SPEC.cusco.path; const u=Math.min(1,Math.max(0,(t-t0)/(t1-t0))); return x0+(SPEC.cusco.pos[0]-x0)*u;};
window.renderAt=(f)=>{
  const t=f/FPS; const spk=speakerAt(t); const focus=lastSpeaker(t);
  for(const [k,c] of Object.entries(C)){
    const A=c.acts, sp=c.sp;
    if(k==='cusco'){
      const x=cuscoX(t), ww=win(t,sp.path[0],sp.path[1],0.2), lat=win(t,TL.latido-0.05,TL.latido+0.8,0.1);
      c.root.position.set(x,0,sp.pos[2]);
      const want= ww>0.5 ? -Math.PI/2 : Math.max(-1.3,Math.min(0.4,Math.atan2(C[focus].root.position.x-x,1.1)-0.3));
      c.yaw+=(want-c.yaw)*(ww>0.5?0.3:0.08); c.root.rotation.y=c.yaw;
      const ph=Math.abs(x-sp.path[2])/sp.cyc;
      A.trote.time=(ph*A.trote.getClip().duration)%A.trote.getClip().duration; A.trote.setEffectiveWeight(ww);
      A.latir.time=Math.max(0,t-TL.latido)%A.latir.getClip().duration; A.latir.setEffectiveWeight((1-ww)*lat);
      A.parado.time=t%A.parado.getClip().duration; A.parado.setEffectiveWeight((1-ww)*(1-lat)); c.mixer.update(0); continue;
    }
    // corpo: soma das ações da direção de cena; o resto é falar/ouvir/parado
    const W={}; let used=0; const face={};
    for(const d of (TL.direcao[k]||[])){ const w=win(t,d.s,d.e); if(w<=0) continue;
      if(d.acao){ W[d.acao]=(W[d.acao]||0)+w; used+=w; }
      for(const [kk,v] of Object.entries(d.rosto)) face[kk]=(face[kk]||0)+v*w; }
    used=Math.min(1,used); const free=1-used, tk=talkW(k,t);
    W.falar=(W.falar||0)+free*tk; W.ouvir=(W.ouvir||0)+free*(1-tk)*0.6; W.parado=(W.parado||0)+free*(1-tk)*0.4;
    for(const [n,ac] of Object.entries(A)){
      const dur=ac.getClip().duration;
      // ação dirigida: o tempo conta a partir do início dela (gestos de uma vez só começam do começo)
      let dd=null; for(const d of (TL.direcao[k]||[])) if(d.acao===n && t>=d.s-0.3 && t<=d.e+0.3) dd=d;
      if(n==='bah' && dd) ac.time=Math.min(Math.max(t-dd.s,0),dur-0.01);
      else if(dd) ac.time=Math.max(0,t-dd.s)%dur;
      else ac.time=(t+k.length*0.37)%dur;
      ac.setEffectiveWeight(W[n]||0);
    }
    c.mixer.update(0);
    // olhar: vira para quem fala
    const want = focus===k ? sp.yaw*0.4 : Math.atan2(C[focus].root.position.x-sp.pos[0],1.0)*0.85;
    c.yaw+=(want-c.yaw)*0.08; c.root.rotation.y=c.yaw;
    // rosto: boca (visemas) + expressão + piscadas
    const q=Object.assign({},(TL.boca[k]||[])[f]||{});
    for(const [kk,v] of Object.entries(face)) q[kk]=(q[kk]||0)+v;
    let bl=0; for(const tb of TL.piscadas[k]){ const u=(t-tb)/0.2; if(u>0&&u<1) bl=Math.max(bl,Math.sin(u*Math.PI)); }
    if(bl>0 && !(face.piscar_d>0.5)){ q.piscar_d=Math.max(q.piscar_d||0,bl*0.85); q.piscar_e=Math.max(q.piscar_e||0,bl*0.85); }
    for(const m of c.ms){ m.morphTargetInfluences.fill(0); for(const [kk,v] of Object.entries(q)){const i=m.morphTargetDictionary[kk]; if(i!==undefined)m.morphTargetInfluences[i]=Math.min(1.2,v);} }
  }
  // câmera: geral no começo e no fim; mais perto de quem fala (para ver o rosto)
  const shot=(tt)=>{ const q=lastSpeaker(tt); const near = tt>1.0 && tt<TL.falas[5].e+1.2;
    return near? {x:SPEC[q].pos[0]*0.9, y:SPEC[q].head*0.93, z:(q==='lauro'?2.0:1.7)} : {x:0, y:0.56, z:3.7}; };
  let cx=0,cy=0,cz=0; for(let i=0;i<18;i++){const s=shot(t-i*0.05); cx+=s.x/18; cy+=s.y/18; cz+=s.z/18;}
  cam.position.set(cx*0.75, cy+0.3+0.015*Math.sin(t*0.6), cz); cam.lookAt(cx, cy, 0);
  r.render(scene,cam);
  const w=TL.palavras.find(p=>t>=p.s && t<Math.max(p.e+0.12,p.s+0.2));
  const GA=['bah','tchê','guri','guria','piá']; const cap=document.getElementById('cap');
  if(w){const clean=w.w.toLowerCase().replace(/[?!.,]/g,''); const k=Math.min(1,(t-w.s)/0.09); cap.innerHTML=`<span style="color:${GA.includes(clean)?'#D9A021':'#fff'};transform:scale(${1+0.18*(1-k)})">${w.w}</span>`;} else cap.innerHTML='';
  const tit=document.getElementById('tit'); const tt=t-0.4;
  if(tt>0&&tt<2.0){const k=Math.min(1,tt/0.25); tit.innerHTML='BAH, TU<br>SABIA…?'; tit.style.opacity=Math.min(1,(2.0-tt)/0.25); tit.style.transform=`rotate(-4deg) scale(${0.6+0.4*k+0.08*Math.sin(k*Math.PI)})`;} else tit.innerHTML='';
  return true;
};
window.DONE=true;
</script></body></html>
