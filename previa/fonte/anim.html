<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,c=document.getElementById('c'),g=c.getContext('2d');
let DATA=null;
const MUST='#D9A021',GAUCHO=['bah','tchê','cacetinho','cacetinhos','negrinho','cacetinho?!'];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), ease=t=>1-Math.pow(1-clamp(t,0,1),3);
const lerp=(a,b,t)=>a+(b-a)*t;
function rms(t){const i=Math.floor(t*30);return DATA.rms[i]||0}
function ell(x,y,rx,ry,fill,rot=0){g.beginPath();g.ellipse(x,y,rx,ry,rot,0,Math.PI*2);g.fillStyle=fill;g.fill()}
function rr(x,y,w,h,r,fill){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill()}

/* ---------- BACKGROUNDS ---------- */
function bakeryBG(t){
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#F6DDA8');gr.addColorStop(1,'#E2AE6C');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // tiles
  g.strokeStyle='rgba(160,100,40,.12)';g.lineWidth=3;
  for(let y=0;y<1500;y+=90){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  // lamps
  for(const x of [220,860]){g.strokeStyle='#3a2a1a';g.lineWidth=4;g.beginPath();g.moveTo(x,0);g.lineTo(x,150);g.stroke();
    ell(x,165,70,30,'#2F6B3A');ell(x,185,30,14,'rgba(255,240,180,.9)');
    let lg=g.createRadialGradient(x,200,10,x,200,320);lg.addColorStop(0,'rgba(255,230,150,.35)');lg.addColorStop(1,'rgba(255,230,150,0)');g.fillStyle=lg;g.fillRect(x-320,180,640,500)}
  // shelves with bread
  for(const sy of [420,700]){rr(40,sy,1000,26,6,'#7A4A24');
    for(let i=0;i<9;i++){const bx=95+i*110;ell(bx,sy-34,48,32,'#C98A3A');ell(bx-6,sy-42,34,18,'#E2A957');
      g.strokeStyle='#8A5420';g.lineWidth=4;g.beginPath();g.moveTo(bx-20,sy-46);g.lineTo(bx-4,sy-30);g.moveTo(bx,sy-50);g.lineTo(bx+16,sy-32);g.stroke()}}
  // soft blur overlay to push BG back
  g.fillStyle='rgba(255,236,200,.28)';g.fillRect(0,0,W,H);
}
function counterFG(){
  // glass display counter in foreground
  rr(-20,1560,1120,400,0,'#6B3E1E');
  rr(-20,1560,1120,40,0,'#8B5A2B');
  g.fillStyle='rgba(210,240,255,.28)';g.fillRect(0,1600,W,200);
  for(let i=0;i<7;i++){const bx=90+i*150;ell(bx,1745,60,36,'#C98A3A');ell(bx-8,1735,40,20,'#E2A957')}
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=6;g.beginPath();g.moveTo(120,1610);g.lineTo(40,1790);g.moveTo(170,1610);g.lineTo(90,1790);g.stroke();
}
function spBG(t){
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#D5DEE3');gr.addColorStop(1,'#AEBCC4');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // window with skyline
  rr(120,260,840,700,10,'#2E3A40');
  let sky=g.createLinearGradient(0,280,0,940);sky.addColorStop(0,'#9EC9E8');sky.addColorStop(1,'#DDEBF3');
  rr(140,280,800,660,6,sky);
  const b=[[150,520,110],[270,440,90],[370,600,130],[510,380,100],[620,480,120],[750,410,90],[850,560,90]];
  for(const [x,y,w] of b){g.fillStyle='#7E8C96';g.fillRect(x,y,w,940-y);g.fillStyle='#C9D6DE';
    for(let yy=y+20;yy<920;yy+=46)for(let xx=x+14;xx<x+w-16;xx+=32)g.fillRect(xx,yy,14,22)}
  g.fillStyle='#2E3A40';g.fillRect(535,280,10,660);g.fillRect(140,600,800,10);
  // sign
  rr(560,150,400,84,14,'#B23A2E');g.fillStyle='#fff';g.font='900 50px Montserrat';g.textAlign='center';g.fillText('PADARIA',760,210);
  g.fillStyle='rgba(230,240,245,.25)';g.fillRect(0,0,W,H);
  // counter
  rr(-20,1600,1120,360,0,'#9AA4AA');rr(-20,1600,1120,36,0,'#C4CCD0');
}

/* ---------- LAURO ---------- */
function lauro(t,mode){
  const talk=rms(t);
  g.save();
  // ---- body ----
  // right arm (viewer left) holding cuia
  // shirt torso
  g.beginPath();g.moveTo(150,1950);g.lineTo(230,1270);g.quadraticCurveTo(540,1150,850,1270);g.lineTo(930,1950);g.closePath();g.fillStyle='#F2EEE6';g.fill();
  // vest panels
  g.beginPath();g.moveTo(150,1950);g.lineTo(230,1270);g.quadraticCurveTo(360,1215,445,1230);g.lineTo(470,1950);g.closePath();g.fillStyle='#4A2E1F';g.fill();
  g.beginPath();g.moveTo(930,1950);g.lineTo(850,1270);g.quadraticCurveTo(720,1215,635,1230);g.lineTo(610,1950);g.closePath();g.fill();
  // neck
  rr(470,1080,140,150,40,'#C98F62');
  // lenço (mustard)
  g.beginPath();g.moveTo(400,1180);g.quadraticCurveTo(540,1250,680,1180);g.lineTo(640,1235);g.quadraticCurveTo(540,1290,440,1235);g.closePath();g.fillStyle=MUST;g.fill();
  g.beginPath();g.moveTo(520,1250);g.lineTo(470,1390);g.lineTo(535,1340);g.closePath();g.fillStyle='#C48D17';g.fill();
  g.beginPath();g.moveTo(560,1250);g.lineTo(615,1385);g.lineTo(548,1338);g.closePath();g.fill();
  ell(540,1255,38,32,'#E5B03A');
  // left hand (viewer right): waving in laugh mode
  if(mode==='laugh'){const wv=Math.sin(t*12)*0.25;
    g.save();g.translate(860,1330);g.rotate(-0.9+wv);rr(-38,-200,76,220,36,'#F2EEE6');rr(-34,-330,68,150,30,'#C98F62');ell(0,-350,52,58,'#D9A070');g.restore()}
  // right arm + cuia
  g.save();
  rr(175,1260,110,250,50,'#F2EEE6');            // upper arm (rolled sleeve)
  rr(185,1440,95,40,14,'#E3DDD2');              // sleeve roll
  g.translate(250,1470);g.rotate(-0.55);rr(-42,-10,84,190,40,'#C98F62');g.restore(); // forearm
  const cx=360,cy=1440;
  // bomba (silver straw)
  g.strokeStyle='#C9CCD1';g.lineWidth=12;g.lineCap='round';g.beginPath();g.moveTo(cx+10,cy-60);g.lineTo(cx+70,cy-250);g.stroke();
  ell(cx+72,cy-256,10,8,'#C8A74A');
  ell(cx,cy,92,110,'#5C3A21');ell(cx-30,cy-20,22,50,'rgba(255,255,255,.12)');
  ell(cx,cy-92,78,22,'#C9CCD1');ell(cx,cy-92,64,14,'#6E8B3D');
  g.strokeStyle='#9EA3AA';g.lineWidth=4;for(let i=-60;i<=60;i+=20){g.beginPath();g.moveTo(cx+i,cy-100);g.lineTo(cx+i*0.9,cy-80);g.stroke()}
  ell(cx+70,cy+20,58,52,'#D9A070'); // hand
  // steam
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=7;
  for(let k=0;k<3;k++){const ph=(t*0.9+k*0.33)%1;g.globalAlpha=1-ph;g.beginPath();
    const sx=cx-30+k*30,sy=cy-110-ph*160;g.moveTo(sx,sy);g.bezierCurveTo(sx+25,sy-30,sx-25,sy-60,sx,sy-90);g.stroke()}
  g.globalAlpha=1;
  // ---- head ----
  g.save();
  const tilt=mode==='laugh'?-0.07+Math.sin(t*10)*0.02:Math.sin(t*2.2)*0.015;
  g.translate(540,900);g.rotate(tilt);g.translate(-540,-900);
  ell(330,930,40,60,'#C98F62');ell(750,930,40,60,'#C98F62'); // ears
  ell(540,900,215,240,'#D9A070');                       // face
  let jg=g.createLinearGradient(0,980,0,1140);jg.addColorStop(0,'rgba(90,60,40,0)');jg.addColorStop(1,'rgba(90,60,40,.28)');ell(540,1010,200,130,jg); // stubble
  ell(430,990,40,24,'rgba(230,110,90,.35)');ell(650,990,40,24,'rgba(230,110,90,.35)'); // cheeks
  // eyes
  const shock=mode==='hook'?ease(t/0.25):0, eyeS=1+0.18*shock;
  if(mode==='laugh'){g.strokeStyle='#2B1A0E';g.lineWidth=12;g.lineCap='round';
    for(const ex of [460,620]){g.beginPath();g.arc(ex,905,40,Math.PI*1.1,Math.PI*1.9);g.stroke()}}
  else{const blink=(t%3.7>3.55)?0.1:1;
    for(const ex of [460,620]){ell(ex,890,46*eyeS,56*eyeS*blink,'#fff');ell(ex+4,895,26*eyeS,28*eyeS*blink,'#5A3A1E');ell(ex+4,895,12*eyeS,13*eyeS*blink,'#1a0f08');ell(ex+14,884,7,7,'#fff')}}
  // brows
  const by=mode==='hook'?-38*shock:mode==='laugh'?-22:0;
  g.fillStyle='#3B2414';
  g.save();g.translate(455,815+by);g.rotate(-0.12);g.beginPath();g.roundRect(-62,-16,124,32,16);g.fill();g.restore();
  g.save();g.translate(625,815+by);g.rotate(0.12);g.beginPath();g.roundRect(-62,-16,124,32,16);g.fill();g.restore();
  ell(540,960,40,46,'#C98458'); // nose
  // mouth
  const open=clamp(talk,0,1);
  if(mode==='laugh'){g.beginPath();g.ellipse(540,1060,70,20+60*open,0,0,Math.PI);g.fillStyle='#5A1A1A';g.fill();ell(540,1062,60,10,'#fff')}
  else{ell(540,1062,26+20*open+(mode==='hook'?14*shock:0),8+52*open,'#5A1A1A');ell(540,1072+30*open,18+10*open,4+14*open,'#C25A5A')}
  // mustache
  g.fillStyle='#5A3A22';g.beginPath();g.moveTo(540,1010);
  g.bezierCurveTo(470,985,400,1000,385,1060);g.bezierCurveTo(420,1045,470,1045,540,1035);
  g.bezierCurveTo(610,1045,660,1045,695,1060);g.bezierCurveTo(680,1000,610,985,540,1010);g.fill();
  // hat
  g.strokeStyle='#6B4226';g.lineWidth=7;g.beginPath();g.moveTo(345,720);g.quadraticCurveTo(330,1000,540,1140);g.quadraticCurveTo(750,1000,735,720);g.stroke(); // barbicacho
  rr(375,560,330,170,40,'#1E1B18');rr(375,690,330,30,0,'#3a332c');
  ell(540,725,330,58,'#1E1B18');ell(540,712,300,30,'#2A2622');
  g.restore();
  g.restore();
}

/* ---------- CLERK (SP) ---------- */
function clerk(t){
  const talk=(t>6.55&&t<8.35)?rms(t):0, ts=t-3.9;
  g.save();
  // torso light blue shirt + white apron
  g.beginPath();g.moveTo(200,1950);g.lineTo(270,1300);g.quadraticCurveTo(540,1200,810,1300);g.lineTo(880,1950);g.closePath();g.fillStyle='#8FB3D6';g.fill();
  g.beginPath();g.moveTo(330,1950);g.lineTo(380,1330);g.lineTo(700,1330);g.lineTo(750,1950);g.closePath();g.fillStyle='#FAFAFA';g.fill();
  g.strokeStyle='#ddd';g.lineWidth=8;g.beginPath();g.moveTo(400,1330);g.lineTo(470,1180);g.moveTo(680,1330);g.lineTo(610,1180);g.stroke();
  rr(485,1100,110,140,40,'#E8B48C');
  // paper bag in hand (viewer right)
  rr(760,1380,150,190,10,'#B98A55');rr(760,1380,150,28,6,'#A27645');ell(780,1500,46,50,'#F1C29A');
  // head tilt grows
  const tilt=0.04+0.16*ease(ts/1.2)+(t>6.6&&t<6.9?Math.sin(t*90)*0.03:0);
  g.save();g.translate(540,900);g.rotate(tilt);g.translate(-540,-900);
  ell(345,930,34,52,'#E8B48C');ell(735,930,34,52,'#E8B48C');
  ell(540,910,195,225,'#F1C29A');
  ell(440,990,34,20,'rgba(240,120,100,.3)');ell(640,990,34,20,'rgba(240,120,100,.3)');
  const blink=(ts>1.6&&ts<1.75)?0.1:1, pop=(t>6.6)?1.12:1;
  for(const ex of [465,615]){ell(ex,900,40*pop,48*pop*blink,'#fff');ell(ex,905,22*pop,24*pop*blink,'#3A2A1A');ell(ex+8,896,6,6,'#fff')}
  g.fillStyle='#4A3424';
  g.save();g.translate(465,830);g.rotate(0.15);g.beginPath();g.roundRect(-52,-11,104,22,11);g.fill();g.restore();
  g.save();g.translate(615,800-10*ease(ts/0.8));g.rotate(-0.35);g.beginPath();g.roundRect(-52,-11,104,22,11);g.fill();g.restore(); // raised brow
  ell(540,965,26,32,'#E09D78');
  ell(552,1055,20+18*talk,6+46*talk,'#5A1A1A'); // mouth (offset = confused)
  // hair + paper cap
  g.fillStyle='#3A2A1A';g.beginPath();g.ellipse(540,760,190,90,0,Math.PI,0);g.fill();
  g.beginPath();g.moveTo(370,760);g.lineTo(400,600);g.lineTo(680,600);g.lineTo(710,760);g.closePath();g.fillStyle='#FFFFFF';g.fill();
  rr(365,730,350,45,10,'#EDEDED');
  g.restore();
  // question marks
  for(const [tq,x,y] of [[6.6,820,640],[7.7,240,560]]){if(t>tq){const s=ease((t-tq)/0.2);
    g.save();g.translate(x,y);g.scale(s,s);g.rotate(Math.sin(t*6)*0.15);g.font='900 190px Montserrat';g.textAlign='center';
    g.lineWidth=16;g.strokeStyle='#1a1a1a';g.strokeText('?',0,0);g.fillStyle='#fff';g.fillText('?',0,0);g.restore()}}
  g.restore();
}

/* ---------- OVERLAYS ---------- */
function pill(text,x,y,size,bg,fg,align='center',alpha=1){
  g.save();g.globalAlpha=alpha;g.font=`900 ${size}px Montserrat, "Noto Color Emoji"`;
  const w=g.measureText(text).width+size*1.1,h=size*1.7;let px=align==='center'?x-w/2:x;
  g.shadowColor='rgba(0,0,0,.25)';g.shadowBlur=14;g.shadowOffsetY=5;rr(px,y-h/2,w,h,h/2,bg);g.shadowColor='transparent';
  g.fillStyle=fg;g.textAlign='left';g.textBaseline='middle';g.fillText(text,px+size*0.55,y+2);g.restore();
}
function hud(){
  g.save();g.font='900 34px Montserrat';const t1='BAH, TU SABIA?',t2=' · #001';
  const w=g.measureText(t1+t2).width+44;rr(48,150,w,62,14,'rgba(20,16,12,.72)');
  g.textBaseline='middle';g.textAlign='left';g.fillStyle=MUST;g.fillText(t1,70,183);g.fillStyle='#fff';g.fillText(t2,70+g.measureText(t1).width,183);
  g.restore();
  pill('🗣️ DICIONÁRIO GAÚCHO',48,258,26,'rgba(255,255,255,.95)','#2A2420','left');
}
function title(t){
  if(t>1.5)return;const s=t<0.18?ease(t/0.18)*1.15:lerp(1.15,1,ease((t-0.18)/0.15)),a=t>1.25?1-(t-1.25)/0.25:1;
  g.save();g.globalAlpha=clamp(a,0,1);g.translate(540,520);g.scale(s,s);g.rotate(-0.04);
  g.font='900 118px Montserrat';g.textAlign='center';g.textBaseline='middle';
  g.lineJoin='round';g.lineWidth=26;g.strokeStyle='#2A1A0A';g.strokeText('BAH, TU',0,-70);g.strokeText('SABIA?',0,60);
  g.fillStyle=MUST;g.fillText('BAH, TU',0,-70);g.fillText('SABIA?',0,60);g.restore();
}
function caption(t){
  const w=DATA.words.find(x=>t>=x[1]&&t<Math.max(x[2]+0.12,x[1]+0.15));if(!w)return;
  const k=w[0], gold=GAUCHO.includes(k.toLowerCase().replace(/[?!]/g,''))||GAUCHO.includes(k.toLowerCase());
  const s=1+0.18*(1-ease((t-w[1])/0.09));
  g.save();g.translate(540,1470);g.scale(s,s);g.font='900 104px Montserrat';g.textAlign='center';g.textBaseline='middle';
  g.lineJoin='round';g.lineWidth=20;g.strokeStyle='rgba(0,0,0,.9)';g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=18;g.shadowOffsetY=8;
  g.strokeText(k,0,0);g.shadowColor='transparent';g.fillStyle=gold?MUST:'#fff';g.fillText(k,0,0);g.restore();
}

/* ---------- TIMELINE ---------- */
window.render=function(t){
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);
  let scene=t<3.9?1:t<8.6?2:3;
  // camera
  let z=1,sx=0,sy=0;
  if(scene===1){z=1.0+0.07*ease(t/3.9);if(t<0.25){sx=Math.sin(t*120)*10*(1-t/0.25)}}
  if(scene===2){z=1.02+0.05*((t-3.9)/4.7);if(t>6.6&&t<6.85){sx=Math.sin(t*140)*16;sy=Math.cos(t*120)*10}
    if(t>7.7){z+=0.1*(1-ease((t-7.7)/0.2))+0.04}}
  if(scene===3){z=1.05;sx=Math.sin(t*9)*3}
  g.save();g.translate(540+sx,1000+sy);g.scale(z,z);g.translate(-540,-1000);
  if(scene===2){spBG(t);clerk(t)}else{bakeryBG(t);lauro(t,scene===1?'hook':'laugh');counterFG()}
  g.restore();
  // overlays
  hud();
  if(scene===1)title(t);
  if(scene===2){const a=ease((t-3.9)/0.15);g.save();g.translate(540,360);g.scale(a,a);pill('📍 SÃO PAULO',0,0,40,'#fff','#B23A2E');g.restore()}
  caption(t);
  // cut flash
  for(const ct of [3.9,8.6]){if(t>=ct&&t<ct+0.1){g.fillStyle=`rgba(255,255,255,${1-(t-ct)/0.1})`;g.fillRect(0,0,W,H)}}
  // fade out end
  if(t>9.7){g.fillStyle=`rgba(0,0,0,${(t-9.7)/0.3})`;g.fillRect(0,0,W,H)}
};
window.setData=d=>{DATA=d};
</script></body></html>
